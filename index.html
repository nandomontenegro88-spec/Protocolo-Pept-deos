<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Protocolo">
<title>Protocolo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<meta name="theme-color" content="#F2F2F7">
<link rel="manifest" href="data:application/json,{%22name%22:%22Protocolo%22,%22short_name%22:%22Protocolo%22,%22display%22:%22standalone%22,%22background_color%22:%22%23F2F2F7%22,%22theme_color%22:%22%23F2F2F7%22}">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;color:#1C1C1E;-webkit-font-smoothing:antialiased;min-height:100vh}
#root{max-width:480px;margin:0 auto}
button{font-family:inherit}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState} = React;
const h = React.createElement;

const DN=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DF=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const MN=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const TAGS={0:'descanso',1:'treino',2:'descanso',3:'treino',4:'descanso',5:'treino',6:'reta'};
const C={
  ret:{bg:'#EAF3FF',border:'#B8D4F8',text:'#1A56A0',icon:'#4F9CF9'},
  ipa:{bg:'#EDFAF3',border:'#AEEACB',text:'#1A6B40',icon:'#34A865'},
  mots:{bg:'#FFF5E6',border:'#FFCF7D',text:'#8B5000',icon:'#F4A942'},
  ghk:{bg:'#E6FBF7',border:'#8EE5D5',text:'#0B6B5A',icon:'#1DBFA3'},
  sel:{bg:'#F3EFFF',border:'#C9B8F8',text:'#4B2FAA',icon:'#8B5CF6'},
};
const ICONS={ret:'◉',ipa:'◈',mots:'⚡',ghk:'◆',sel:'◎'};
const P={
  ret:{name:'Retatrutida',short:'20 mg/mL · 1× semana',conc:'20 mg/mL',dose:'10 mg',units:'50 U',vol:'0,50 mL',via:'Subcutânea — abdómen',timing:'Manhã — hora fixa',freq:'1× semana (sábado)',note:'Aplicar sempre no mesmo dia e hora. Guardar no frigorífico. Efeitos GI maiores nas primeiras 24-48h após a injeção.'},
  ipa:{name:'Ipamorelin',short:'5 mg/mL · pré-cama',conc:'5 mg/mL',dose:'300 mcg',units:'10 U',vol:'0,10 mL',via:'Subcutânea — abdómen',timing:'Pré-cama (2h+ após refeição)',freq:'Todos os dias',note:'Jejum de 2h essencial — insulina elevada bloqueia a resposta de GH. Amplifica o pulso natural de GH durante o sono profundo.'},
  mots:{name:'MOTS-c',short:'20 mg/mL · dias treino',conc:'20 mg/mL',dose:'5 mg',units:'25 U',vol:'0,25 mL',via:'Subcutânea — abdómen ou coxa',timing:'Manhã em jejum (30-60 min antes treino)',freq:'3× semana (Seg/Qua/Sex)',note:'Ativar AMPK em jejum potencia oxidação de gordura e cria sinergia com o exercício. Ciclo: 4 sem ataque → 4-8 manutenção → 6-8 pausa.'},
  ghk:{name:'GHK-Cu',short:'10 mg/mL · pré-cama',conc:'10 mg/mL',dose:'2 mg',units:'20 U',vol:'0,20 mL',via:'Subcutânea — abdómen',timing:'Pré-cama (junto com Ipamorelin)',freq:'Todos os dias',note:'Remodelação de colagénio e reparação tecidual são processos noturnos. Nunca misturar na mesma seringa que o Ipamorelin.'},
  sel:{name:'Selank',short:'5 mg/mL · manhã',conc:'5 mg/mL',dose:'500 mcg',units:'10 U',vol:'0,10 mL',via:'Subcutânea — abdómen',timing:'Manhã (junto com MOTS-c nos dias treino)',freq:'5× semana (Seg a Sex)',note:'Efeito ansiolítico e de foco cobre a manhã e o treino. Evitar ao final do dia. Descansar ao fim de semana.'},
};
const SCH={
  0:{m:[],n:['ipa','ghk']},
  1:{m:['mots','sel'],n:['ipa','ghk']},
  2:{m:['sel'],n:['ipa','ghk']},
  3:{m:['mots','sel'],n:['ipa','ghk']},
  4:{m:['sel'],n:['ipa','ghk']},
  5:{m:['mots','sel'],n:['ipa','ghk']},
  6:{m:['ret'],n:['ipa','ghk']},
};


function ProtoTab({setTab}){
  var peptideos=[
    {key:'ret', name:'Retatrutida', cor:'#4F9CF9', bg:'#EAF3FF', border:'#B8D4F8', text:'#1A56A0',
     vial:'60 mg', diluente:'3 mL', conc:'20 mg/mL',
     dose:'10 mg', unidades:'50 U', vol:'0,50 mL',
     freq:'1× semana (sábado)', timing:'Manhã — hora fixa',
     via:'Subcutânea — abdómen',
     ciclo:'Uso contínuo semanal',
     nota:'Aplicar sempre no mesmo dia e hora. Guardar no frigorífico. Efeitos GI maiores nas primeiras 24-48h.'},
    {key:'ipa', name:'Ipamorelin', cor:'#34A865', bg:'#EDFAF3', border:'#AEEACB', text:'#1A6B40',
     vial:'10 mg', diluente:'2 mL', conc:'5 mg/mL',
     dose:'300 mcg', unidades:'10 U', vol:'0,10 mL',
     freq:'Todos os dias', timing:'Pré-cama (2h+ após refeição)',
     via:'Subcutânea — abdómen',
     ciclo:'Uso diário contínuo',
     nota:'Jejum de 2h essencial — insulina elevada bloqueia a resposta de GH. Não misturar com GHK-Cu na mesma seringa.'},
    {key:'mots', name:'MOTS-c', cor:'#F4A942', bg:'#FFF5E6', border:'#FFCF7D', text:'#8B5000',
     vial:'40 mg', diluente:'2 mL', conc:'20 mg/mL',
     dose:'5 mg', unidades:'25 U', vol:'0,25 mL',
     freq:'3× semana (Seg/Qua/Sex)', timing:'Manhã em jejum (30-60 min antes treino)',
     via:'Subcutânea — abdómen ou coxa',
     ciclo:'4 sem ataque → 4-8 sem manutenção → 6-8 sem pausa',
     nota:'Administrar nos dias de treino em jejum. Ativa AMPK — sinergia com o exercício. Protocolo de ataque: 15 mg/semana.'},
    {key:'ghk', name:'GHK-Cu', cor:'#1DBFA3', bg:'#E6FBF7', border:'#8EE5D5', text:'#0B6B5A',
     vial:'100 mg', diluente:'10 mL', conc:'10 mg/mL',
     dose:'2 mg', unidades:'20 U', vol:'0,20 mL',
     freq:'Todos os dias', timing:'Pré-cama (junto com Ipamorelin)',
     via:'Subcutânea — abdómen',
     ciclo:'30 dias on / 30 dias off',
     nota:'Remodelação de colagénio e reparação tecidual são processos noturnos. Nunca misturar na mesma seringa que o Ipamorelin.'},
    {key:'sel', name:'Selank', cor:'#8B5CF6', bg:'#F3EFFF', border:'#C9B8F8', text:'#4B2FAA',
     vial:'10 mg', diluente:'2 mL', conc:'5 mg/mL',
     dose:'500 mcg', unidades:'10 U', vol:'0,10 mL',
     freq:'5× semana (Seg a Sex)', timing:'Manhã (com MOTS-c nos dias treino)',
     via:'Subcutânea — abdómen',
     ciclo:'5 dias on / 2 dias off',
     nota:'Efeito ansiolítico e de foco. Evitar ao final do dia. Descansar ao fim de semana para manter sensibilidade recetoral.'},
  ];

  var rows=[
    ['Vial',        'vial'],
    ['Diluente',    'diluente'],
    ['Concentração','conc'],
    ['Dose',        'dose'],
    ['Seringa U-100','unidades'],
    ['Volume',      'vol'],
    ['Via',         'via'],
    ['Timing',      'timing'],
    ['Frequência',  'freq'],
    ['Ciclo',       'ciclo'],
  ];

  return h('div',{style:{maxWidth:480,margin:'0 auto',background:'#F2F2F7',minHeight:'100vh',fontFamily:'-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif',paddingBottom:80}},
    // header
    h('div',{style:{padding:'16px 20px 14px',background:'#F2F2F7',borderBottom:'1px solid #E5E5EA'}},
      h('h1',{style:{fontSize:24,fontWeight:700,color:'#1C1C1E',margin:0}}, 'Protocolo Completo'),
      h('p',{style:{fontSize:13,color:'#8E8E93',marginTop:3}}, '5 peptídeos · doses e diluições')
    ),
    // cards
    h('div',{style:{padding:'16px'}},
      peptideos.map(function(p){
        return h('div',{key:p.key,style:{background:'#FFF',borderRadius:18,marginBottom:14,overflow:'hidden',boxShadow:'0 1px 4px rgba(0,0,0,0.07)'}},
          // header do card
          h('div',{style:{background:p.bg,borderBottom:'1px solid '+p.border,padding:'14px 16px',display:'flex',alignItems:'center',gap:12}},
            h('div',{style:{width:42,height:42,borderRadius:11,background:'rgba(255,255,255,0.7)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:21,color:p.cor,flexShrink:0}},ICONS[p.key]),
            h('div',null,
              h('div',{style:{fontSize:16,fontWeight:700,color:p.text}},p.name),
              h('div',{style:{fontSize:12,color:p.text,opacity:0.7,marginTop:2}},p.conc+' · '+p.freq)
            ),
            h('div',{style:{marginLeft:'auto',flexShrink:0,textAlign:'right'}},
              h('div',{style:{fontSize:24,fontWeight:800,color:p.cor,lineHeight:1}},p.unidades),
              h('div',{style:{fontSize:10,color:p.text,opacity:0.6,marginTop:2}},p.vol)
            )
          ),
          // rows
          h('div',{style:{padding:'0 16px'}},
            rows.map(function(row,i){
              return h('div',{key:row[0],style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'11px 0',borderBottom:i<rows.length-1?'1px solid #F2F2F7':'none'}},
                h('span',{style:{fontSize:13,color:'#8E8E93',flexShrink:0}},row[0]),
                h('span',{style:{fontSize:13,fontWeight:600,color:'#1C1C1E',textAlign:'right',maxWidth:'60%',marginLeft:8}},p[row[1]])
              );
            }),
            // nota
            h('div',{style:{margin:'10px 0 14px',padding:12,background:'#F2F2F7',borderRadius:10,fontSize:12,color:'#636366',lineHeight:1.6}},p.nota)
          )
        );
      })
    ),
    // tab bar
    h('div',{style:{position:'fixed',bottom:0,left:0,right:0,zIndex:50,background:'rgba(255,255,255,0.95)',borderTop:'1px solid #E5E5EA',display:'flex',backdropFilter:'blur(10px)',WebkitBackdropFilter:'blur(10px)',maxWidth:480,margin:'0 auto',paddingBottom:'env(safe-area-inset-bottom,0px)'}},
      h('button',{onClick:function(){setTab('hoje');},style:{flex:1,padding:'10px 0 10px',border:'none',background:'transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3}},
        h('span',{style:{fontSize:20}},'◷'),
        h('span',{style:{fontSize:10,fontWeight:700,color:'#8E8E93',letterSpacing:'0.04em'}},'hoje')
      ),
      h('button',{onClick:function(){setTab('protocolo');},style:{flex:1,padding:'10px 0 10px',border:'none',background:'transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3}},
        h('span',{style:{fontSize:20}},'◈'),
        h('span',{style:{fontSize:10,fontWeight:700,color:'#4F9CF9',letterSpacing:'0.04em'}},'protocolo')
      )
    )
  );
}

function App(){
  const today=new Date().getDay();
  const [sel,setSel]=useState(today);
  const [checked,setChecked]=useState(function(){
    try{
      var saved=localStorage.getItem('protocolo_v5');
      return saved?JSON.parse(saved):{};
    }catch(e){return {};}
  });
  const [modal,setModal]=useState(null);
  const [tab,setTab]=useState('hoje');
  const s=SCH[sel], all=[...s.m,...s.n];
  const done=all.filter(k=>checked[sel+'_'+k]).length;
  const pct=all.length>0?Math.round(done/all.length*100):0;
  const refDate=new Date(); refDate.setDate(refDate.getDate()+(sel-today));

  function toggle(e,k){
    e.stopPropagation();
    setChecked(function(p){
      var next=Object.assign({},p);
      next[sel+'_'+k]=!p[sel+'_'+k];
      try{localStorage.setItem('protocolo_v5',JSON.stringify(next));}catch(e){}
      return next;
    });
  }

  function DayBtn({i}){
    const pp=[...SCH[i].m,...SCH[i].n],act=i===sel,tod=i===today;
    return h('button',{
      onClick:()=>setSel(i),
      style:{flexShrink:0,width:46,height:66,borderRadius:14,border:tod?'2px solid #4F9CF9':act?'none':'1.5px solid #D1D1D6',background:act?'#1C1C1E':'#FFF',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3,padding:0,boxShadow:act?'0 2px 12px rgba(0,0,0,0.18)':'0 1px 3px rgba(0,0,0,0.06)'}
    },
      h('span',{style:{fontSize:9,fontWeight:700,textTransform:'uppercase',letterSpacing:'0.07em',color:act?'rgba(255,255,255,0.45)':'#8E8E93'}},DN[i]),
      h('span',{style:{fontSize:17,fontWeight:700,color:act?'#FFF':'#1C1C1E'}},i+1<10?'0'+(i+1):''+(i+1)),
      h('div',{style:{display:'flex',gap:3,minHeight:5}},
        pp.slice(0,4).map((k,j)=>h('span',{key:j,style:{width:5,height:5,borderRadius:'50%',background:C[k].icon,display:'inline-block'}}))
      )
    );
  }

  function Card({k}){
    const p=P[k],col=C[k],isDone=!!checked[sel+'_'+k];
    return h('div',{
      onClick:()=>setModal(k),
      style:{borderRadius:18,padding:'14px 16px',marginBottom:10,display:'flex',alignItems:'center',gap:12,border:'1.5px solid '+col.border,background:col.bg,opacity:isDone?0.5:1,cursor:'pointer',boxShadow:'0 1px 4px rgba(0,0,0,0.06)'}
    },
      h('div',{style:{width:44,height:44,borderRadius:12,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:22,background:'rgba(255,255,255,0.75)',color:col.icon}},ICONS[k]),
      h('div',{style:{flex:1,minWidth:0}},
        h('div',{style:{fontSize:15,fontWeight:700,color:col.text,marginBottom:2}},p.name),
        h('div',{style:{fontSize:12,color:col.text,opacity:0.7}},p.short)
      ),
      h('div',{style:{display:'flex',flexDirection:'column',alignItems:'flex-end',flexShrink:0,gap:5}},
        h('div',{style:{fontSize:23,fontWeight:800,color:col.icon,lineHeight:1}},p.units),
        h('div',{style:{fontSize:10,color:col.text,opacity:0.55}},p.vol),
        h('button',{
          onClick:function(ev){toggle(ev,k);},
          style:{width:32,height:32,borderRadius:'50%',border:isDone?'none':'2px solid '+col.border,background:isDone?col.icon:'rgba(255,255,255,0.9)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,fontWeight:900,color:isDone?'#FFF':'rgba(0,0,0,0.15)',boxShadow:isDone?'0 2px 8px rgba(0,0,0,0.12)':'none',lineHeight:1}
        },'✓')
      )
    );
  }

  function SecLabel({text}){
    return h('div',{style:{display:'flex',alignItems:'center',gap:10,marginBottom:10,marginTop:4}},
      h('span',{style:{fontSize:11,fontWeight:700,color:'#8E8E93',textTransform:'uppercase',letterSpacing:'0.08em',whiteSpace:'nowrap'}},text),
      h('div',{style:{flex:1,height:1,background:'#D1D1D6'}})
    );
  }

  const modalRows=[['Concentração','conc'],['Dose','dose'],['Seringa U-100','units'],['Volume','vol'],['Via','via'],['Timing','timing'],['Frequência','freq']];

  if(tab==='protocolo') return h(ProtoTab,{setTab:setTab});

  return h(React.Fragment,null,
    // HEADER
    h('div',{style:{padding:'16px 20px 12px',background:'#F2F2F7',display:'flex',justifyContent:'space-between',alignItems:'flex-end'}},
      h('div',null,
        h('h1',{style:{fontSize:26,fontWeight:700,letterSpacing:-0.5,color:'#1C1C1E',margin:0}},'Protocolo'),
        h('p',{style:{fontSize:13,color:'#8E8E93',marginTop:3}},DF[sel]+' · '+refDate.getDate()+' '+MN[refDate.getMonth()])
      ),
      h('span',{style:{fontSize:11,fontWeight:700,padding:'5px 13px',borderRadius:20,background:'#E3EEFF',color:'#1A56A0',border:'1px solid #B8D4F8',whiteSpace:'nowrap'}},sel===today?'hoje':TAGS[sel])
    ),
    // DAY STRIP
    h('div',{style:{background:'#F2F2F7',borderBottom:'1px solid #E5E5EA',overflowX:'auto',WebkitOverflowScrolling:'touch'}},
      h('div',{style:{display:'flex',gap:8,padding:'8px 20px 14px',width:'max-content'}},
        [0,1,2,3,4,5,6].map(i=>h(DayBtn,{key:i,i:i}))
      )
    ),
    // PROGRESS
    h('div',{style:{padding:'14px 20px 12px',background:'#FFF',borderBottom:'1px solid #E5E5EA'}},
      h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:8}},
        h('span',{style:{fontSize:12,color:'#8E8E93',fontWeight:500}},'progresso do dia'),
        h('span',{style:{fontSize:12,fontWeight:700,color:'#1C1C1E'}},done+' / '+all.length)
      ),
      h('div',{style:{height:8,background:'#E5E5EA',borderRadius:8,overflow:'hidden'}},
        h('div',{style:{height:'100%',borderRadius:8,background:'linear-gradient(90deg,#4F9CF9,#1DBFA3)',width:pct+'%',transition:'width 0.4s ease'}})
      )
    ),
    // CARDS
    h('div',{style:{padding:'16px 16px 0'}},
      s.m.length>0&&h(SecLabel,{text:'Manhã · em jejum'}),
      ...s.m.map(k=>h(Card,{key:k,k:k})),
      s.m.length>0&&s.n.length>0&&h('div',{style:{height:8}}),
      s.n.length>0&&h(SecLabel,{text:'Pré-cama · 2h após refeição'}),
      ...s.n.map(k=>h(Card,{key:k,k:k})),
      all.length===0&&h('div',{style:{textAlign:'center',padding:'48px 20px',color:'#C7C7CC',fontSize:14}},
        h('div',{style:{fontSize:40,marginBottom:12}},'○'),
        'dia de descanso'
      ),
      // STATS
      h('div',{style:{marginTop:24,paddingTop:20,borderTop:'1px solid #E5E5EA',paddingBottom:40}},
        h('p',{style:{fontSize:11,fontWeight:700,color:'#8E8E93',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:12}},'Resumo semanal'),
        h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}},
          [{val:'15 mg',label:'MOTS-c / semana',color:'#F4A942',bg:'#FFF5E6',border:'#FFCF7D',tc:'#8B5000'},
           {val:'10 mg',label:'Retatrutida / semana',color:'#4F9CF9',bg:'#EAF3FF',border:'#B8D4F8',tc:'#1A56A0'},
           {val:'14 mg',label:'GHK-Cu / semana',color:'#1DBFA3',bg:'#E6FBF7',border:'#8EE5D5',tc:'#0B6B5A'},
           {val:'2,1 mg',label:'Ipamorelin / semana',color:'#34A865',bg:'#EDFAF3',border:'#AEEACB',tc:'#1A6B40'},
           {val:'2,5 mg',label:'Selank / semana',color:'#8B5CF6',bg:'#F3EFFF',border:'#C9B8F8',tc:'#4B2FAA'}
          ].map(function(s){
            return h('div',{key:s.label,style:{background:s.bg,borderRadius:14,padding:14,border:'1px solid '+s.border}},
              h('div',{style:{fontSize:20,fontWeight:700,color:s.color,marginBottom:4}},s.val),
              h('div',{style:{fontSize:11,color:s.tc}},s.label)
            );
          })
        )
      )
    ),
    // MODAL
    // TAB BAR
    h('div',{style:{position:'fixed',bottom:0,left:0,right:0,zIndex:50,background:'rgba(255,255,255,0.95)',borderTop:'1px solid #E5E5EA',display:'flex',backdropFilter:'blur(10px)',WebkitBackdropFilter:'blur(10px)',maxWidth:480,margin:'0 auto',paddingBottom:'env(safe-area-inset-bottom,0px)'}},
      h('button',{onClick:function(){setTab('hoje');},style:{flex:1,padding:'10px 0 10px',border:'none',background:'transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3}},
        h('span',{style:{fontSize:20}},'◷'),
        h('span',{style:{fontSize:10,fontWeight:700,color:tab==='hoje'?'#4F9CF9':'#8E8E93',letterSpacing:'0.04em'}},tab==='hoje'?'hoje':'hoje')
      ),
      h('button',{onClick:function(){setTab('protocolo');},style:{flex:1,padding:'10px 0 10px',border:'none',background:'transparent',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:3}},
        h('span',{style:{fontSize:20}},'◈'),
        h('span',{style:{fontSize:10,fontWeight:700,color:tab==='protocolo'?'#4F9CF9':'#8E8E93',letterSpacing:'0.04em'}},'protocolo')
      )
    ),
    // padding para não ficar atrás da tab bar
    h('div',{style:{height:80}}),
    modal&&h('div',{
      onClick:function(){setModal(null);},
      style:{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',zIndex:200,display:'flex',alignItems:'flex-end',justifyContent:'center',backdropFilter:'blur(4px)',WebkitBackdropFilter:'blur(4px)'}
    },
      h('div',{
        onClick:function(e){e.stopPropagation();},
        style:{background:'#FFF',borderRadius:'24px 24px 0 0',width:'100%',maxWidth:480,maxHeight:'85vh',overflowY:'auto',paddingBottom:32}
      },
        h('div',{style:{width:36,height:4,borderRadius:4,background:'#D1D1D6',margin:'12px auto 0'}}),
        h('div',{style:{padding:'18px 20px 14px',borderBottom:'1px solid #F2F2F7',display:'flex',alignItems:'center',gap:14}},
          h('div',{style:{width:52,height:52,borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,background:C[modal].bg,color:C[modal].icon,flexShrink:0}},ICONS[modal]),
          h('div',null,
            h('div',{style:{fontSize:20,fontWeight:700,color:'#1C1C1E'}},P[modal].name),
            h('div',{style:{fontSize:13,color:'#8E8E93',marginTop:3}},P[modal].short)
          )
        ),
        h('div',{style:{padding:'0 20px'}},
          modalRows.map(function(row,i){
            return h('div',{key:row[0],style:{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'13px 0',borderBottom:i<modalRows.length-1?'1px solid #F2F2F7':'none'}},
              h('span',{style:{fontSize:14,color:'#8E8E93'}},row[0]),
              h('span',{style:{fontSize:14,fontWeight:600,color:'#1C1C1E',textAlign:'right',maxWidth:'58%'}},P[modal][row[1]])
            );
          }),
          h('div',{style:{margin:'14px 0 4px',padding:14,background:'#F2F2F7',borderRadius:12,fontSize:12,color:'#636366',lineHeight:1.6}},P[modal].note),
          h('button',{
            onClick:function(){setModal(null);},
            style:{display:'block',width:'100%',margin:'16px 0 0',padding:15,borderRadius:14,border:'none',background:'#1C1C1E',color:'#FFF',fontSize:16,fontWeight:700,cursor:'pointer'}
          },'Fechar')
        )
      )
    )
  );
}

ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
</html>
